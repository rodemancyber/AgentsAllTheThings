name: verify

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate unicode bait (deterministic)
        run: python scenarios/06-unicode-smuggling/make_bait.py
      - name: Run smoke tests
        run: python verify.py
